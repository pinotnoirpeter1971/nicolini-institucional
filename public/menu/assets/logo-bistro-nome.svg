<!--
  Bistro Nicolini — versao branca, para fundo escuro.

  Origem: "LOGO BISTRO NICOLINI PB.pdf" (Adobe Illustrator 29.4), guardado em
  reference/bistro-originais/. O PDF nao tem fonte nem imagem embutida — o texto
  ja esta em curvas — e os contornos abaixo foram lidos do content stream do
  proprio PDF. Nada foi redesenhado, vetorizado ou reescalado.

  Substitui a exportacao SVG anterior, em que a linha "ALTA GASTRONOMIA" tinha
  perdido os glifos do meio (restavam so "ALTA" e "MIA"), o que obrigava a
  cortar o viewBox de 250,35 para 232 e escondê-la.

  Conferido contra o PDF ponto a ponto e pixel a pixel: mesma caixa, mesma
  massa de tinta (razao 1,00002), nenhum pixel com erro acima de 0,5.

  A cor mora num lugar so: a regra .cls-1 abaixo.

  TRES VARIANTES, todas o mesmo desenho — cada uma e um subconjunto das 32
  formas do original, sem nenhuma alteracao de traco:
    logo-bistro.svg           bloco completo, com a legenda. A legenda tem 11
                              unidades de altura em 515 de largura: so fica
                              legivel a partir de uns 300px de largura.
    logo-bistro-compacta.svg  ornamentos e nome, sem a legenda. Para os
                              tamanhos medios (~130 a 280px).
    logo-bistro-nome.svg      so o nome. Para cabecalhos compactos.

  >>> Esta e a variante SO NOME.
-->
